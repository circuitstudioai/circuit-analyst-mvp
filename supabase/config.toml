project_id = "circuit-analyst-mvp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "https://circuit-analyst.vercel.app"
additional_redirect_urls = ["http://localhost:3000/login", "http://127.0.0.1:3000/login", "https://circuit-analyst.vercel.app/login", "https://circuit-analyst-*.vercel.app/login"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[studio]
enabled = true
port = 54323
